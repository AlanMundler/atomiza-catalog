name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://atomiza.com.ar' }}
      - name: Size budget check
        run: npm run size

  # Los e2e no corrían en CI y se pudrieron (4 tests llevaban meses en rojo:
  # quiz, vaciar carrito, item sin stock). Corren con 1 worker porque el preview
  # es un único servidor estático y en paralelo dan falsos negativos.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://atomiza.com.ar' }}
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright (chromium)
        run: npx playwright test --project=chromium --workers=1
      - name: Guardar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7