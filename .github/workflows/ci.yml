name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://atomiza.com.ar' }}
      - name: Size budget check
        run: npm run size
      - name: Guardar dist para e2e
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publicar artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Los e2e corren con 1 worker porque el preview es un único servidor estático
  # y en paralelo dan falsos negativos.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Bajar dist del build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright (chromium)
        run: npx playwright test --project=chromium --workers=1
      - name: Guardar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notificar IndexNow (indexación inmediata)
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://atomiza.com.ar' }}
