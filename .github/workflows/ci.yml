name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://atomiza.com.ar' }}
      - name: Size budget check
        run: npm run size